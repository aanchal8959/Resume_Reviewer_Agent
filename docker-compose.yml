version: "3.9"

# Phase 1 runs fine WITHOUT Docker (SQLite default). This compose file is the
# starting point for later phases: it wires up postgres so switching the
# backend's DATABASE_URL is the only change required.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gemini-2.0-flash}
      DATABASE_URL: sqlite:///./job_switch_agent.db
      CORS_ORIGINS: http://localhost:3000
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-${LANGSMITH_TRACING:-false}}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-${LANGSMITH_PROJECT:-job-switch-agent}}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-job-switch-agent}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Not used by default in Phase 1 (SQLite remains the default). Uncomment the
  # DATABASE_URL override below to switch the backend to Postgres.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobswitch
      POSTGRES_PASSWORD: jobswitch
      POSTGRES_DB: jobswitch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["with-postgres"]

volumes:
  backend_data:
  pgdata:
